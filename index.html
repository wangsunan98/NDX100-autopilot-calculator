<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纳指100 定投计算器（多货币可定制）</title>
    <style>
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            max-width: 460px;
            width: 100%;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            margin-top: 0;
            color: #1f2937;
            font-size: 22px;
        }
        .sub {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
        }
        label {
            display: block;
            font-size: 15px;
            margin-bottom: 6px;
            color: #374151;
            font-weight: 500;
            margin-top: 15px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 10px;
            box-sizing: border-box;
            background: white;
        }
        button {
            width: 100%;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:active {
            background: #2563eb;
        }
        .result {
            margin-top: 25px;
            padding: 16px;
            background: #f0f9ff;
            border-radius: 10px;
            display: none;
        }
        .result .row {
            margin: 8px 0;
            font-size: 15px;
            color: #374151;
        }
        .result .amount {
            font-size: 28px;
            font-weight: 700;
            color: #1e40af;
            margin: 8px 0;
            text-align: center;
        }
        .result .detail {
            font-size: 14px;
            color: #475569;
            text-align: center;
        }
        .note {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>纳指100 定投计算器</h2>
        <div class="sub">五档PE + 年线偏离微调 · 支持自定义货币</div>

        <label>货币符号（例如：¥、$、€、£）</label>
        <input type="text" id="currencySymbol" value="¥" placeholder="¥">

        <label>最低定投金额（区间下限）</label>
        <input type="number" id="minAmount" value="24.6" step="any" min="0">

        <label>最高定投金额（区间上限）</label>
        <input type="number" id="maxAmount" value="82" step="any" min="0">

        <label>微调金额（年线偏离超过±20%时加减）</label>
        <input type="number" id="adjustAmount" value="5" step="any" min="0">

        <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 20px 0;">

        <label>PE 百分位（0-100，支持小数）</label>
        <input type="number" id="peInput" placeholder="例如：45.5" min="0" max="100" step="any">

        <label>当前纳斯达克100价格</label>
        <input type="number" id="priceInput" placeholder="例如：21000" step="any">

        <label>250日均线值</label>
        <input type="number" id="ma250Input" placeholder="例如：18000" step="any">

        <button onclick="calc()">计算金额</button>

        <div class="result" id="result">
            <div class="row" id="peRow"></div>
            <div class="row" id="levelRow"></div>
            <div class="row" id="baseRow"></div>
            <div class="row" id="priceRow"></div>
            <div class="row" id="maRow"></div>
            <div class="row" id="devRow"></div>
            <div class="row" id="adjustRow"></div>
            <div class="detail">今日建议定投</div>
            <div class="amount" id="amount"></div>
            <div class="detail" id="note"></div>
        </div>
        <div class="note">* 默认人民币区间 24.6～82 元，可自行修改货币和金额</div>
    </div>

    <script>
        // 五档对应的位置比例（0 ~ 1 之间）
        // 原版：82,68,53,39,24.6 映射到 [0,1] 区间
        const levelRatios = [1, 0.756, 0.495, 0.251, 0];
        // 档位名称
        const levelNames = [
            '第1档：极度低估（PE < 20%）',
            '第2档：低估（20% ≤ PE < 50%）',
            '第3档：正常（50% ≤ PE < 80%）',
            '第4档：高估（80% ≤ PE < 95%）',
            '第5档：极度高估（PE ≥ 95%）'
        ];

        function calc() {
            // 读取自定义参数
            const currencySymbol = document.getElementById('currencySymbol').value || '¥';
            const minAmount = parseFloat(document.getElementById('minAmount').value);
            const maxAmount = parseFloat(document.getElementById('maxAmount').value);
            const adjustAmount = parseFloat(document.getElementById('adjustAmount').value);

            // 验证自定义参数
            if (isNaN(minAmount) || minAmount < 0) {
                alert('请输入有效的最低定投金额');
                return;
            }
            if (isNaN(maxAmount) || maxAmount <= minAmount) {
                alert('请输入有效的最高定投金额（需大于最低金额）');
                return;
            }
            if (isNaN(adjustAmount) || adjustAmount < 0) {
                alert('请输入有效的微调金额');
                return;
            }

            // 读取市场数据
            const peInput = document.getElementById('peInput').value;
            const priceInput = document.getElementById('priceInput').value;
            const ma250Input = document.getElementById('ma250Input').value;

            const pe = parseFloat(peInput);
            if (isNaN(pe) || pe < 0 || pe > 100) {
                alert('请输入 0-100 之间的 PE 百分位数值');
                return;
            }
            const price = parseFloat(priceInput);
            if (isNaN(price) || price <= 0) {
                alert('请输入有效的纳斯达克100当前价格');
                return;
            }
            const ma250 = parseFloat(ma250Input);
            if (isNaN(ma250) || ma250 <= 0) {
                alert('请输入有效的250日均线值');
                return;
            }

            // 根据最低最高生成五档基础金额
            const range = maxAmount - minAmount;
            const baseAmounts = levelRatios.map(ratio => minAmount + range * ratio);
            // 保留一位小数
            const roundedBase = baseAmounts.map(a => Math.round(a * 10) / 10);

            // 判断PE档位
            let levelIndex;
            if (pe < 20) levelIndex = 0;
            else if (pe < 50) levelIndex = 1;
            else if (pe < 80) levelIndex = 2;
            else if (pe < 95) levelIndex = 3;
            else levelIndex = 4;

            const baseAmount = roundedBase[levelIndex];
            const levelName = levelNames[levelIndex];

            // 计算年线偏离度
            const deviation = (price - ma250) / ma250 * 100;

            // 微调
            let finalAmount = baseAmount;
            let adjustNote = '';
            if (deviation > 20) {
                finalAmount = baseAmount - adjustAmount;
                adjustNote = `年线偏离 +${deviation.toFixed(2)}% > 20%，基础金额减 ${adjustAmount}`;
            } else if (deviation < -20) {
                finalAmount = baseAmount + adjustAmount;
                adjustNote = `年线偏离 ${deviation.toFixed(2)}% < -20%，基础金额加 ${adjustAmount}`;
            } else {
                adjustNote = `年线偏离 ${deviation.toFixed(2)}%，未超过±20%，不调整`;
            }

            // 限制在最低最高之间
            finalAmount = Math.max(minAmount, Math.min(maxAmount, finalAmount));
            finalAmount = Math.round(finalAmount * 10) / 10;

            // 显示结果
            document.getElementById('peRow').textContent = `PE 百分位：${pe.toFixed(2)}%`;
            document.getElementById('levelRow').textContent = `档位判断：${levelName}`;
            document.getElementById('baseRow').textContent = `基础金额：${currencySymbol}${baseAmount}`;
            document.getElementById('priceRow').textContent = `当前纳指价格：${price}`;
            document.getElementById('maRow').textContent = `250日均线：${ma250}`;
            document.getElementById('devRow').textContent = `年线偏离度：${deviation.toFixed(2)}%`;
            document.getElementById('adjustRow').textContent = `微调说明：${adjustNote}`;
            document.getElementById('amount').textContent = `${currencySymbol}${finalAmount}`;
            document.getElementById('note').textContent = `五档PE + 年线偏离自动微调 · 区间 ${currencySymbol}${minAmount} ~ ${currencySymbol}${maxAmount}`;

            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
