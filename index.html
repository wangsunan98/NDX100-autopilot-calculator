<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDX Autopilot Calculator</title>
    <style>
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            max-width: 460px;
            width: 100%;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            margin-top: 0;
            color: #1f2937;
            font-size: 22px;
            margin-bottom: 6px;
        }
        .disclaimer {
            text-align: center;
            color: #6b7280;
            font-size: 12px;
            margin-bottom: 10px;
            padding: 8px 12px;
            background: #f9fafb;
            border-radius: 6px;
            line-height: 1.5;
        }
        .sub {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
        }
        label {
            display: block;
            font-size: 15px;
            margin-bottom: 6px;
            color: #374151;
            font-weight: 500;
            margin-top: 15px;
        }
        .required {
            color: #ef4444;
            font-weight: 700;
            margin-left: 2px;
        }
        .optional {
            color: #6b7280;
            font-weight: 400;
            font-size: 13px;
            margin-left: 4px;
        }
        .helper-link {
            font-size: 13px;
            color: #3b82f6;
            text-decoration: none;
            margin-left: 8px;
            font-weight: 400;
        }
        .helper-link:hover {
            text-decoration: underline;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 10px;
            box-sizing: border-box;
            background: white;
        }
        button {
            width: 100%;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:active {
            background: #2563eb;
        }
        .toggle-btn {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
            margin-top: 10px;
            font-size: 15px;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
        }
        .toggle-btn:active {
            background: #e5e7eb;
        }
        .result {
            margin-top: 25px;
            padding: 16px;
            background: #f0f9ff;
            border-radius: 10px;
            display: none;
        }
        .result .row {
            margin: 8px 0;
            font-size: 15px;
            color: #374151;
        }
        .result .amount {
            font-size: 28px;
            font-weight: 700;
            color: #1e40af;
            margin: 8px 0;
            text-align: center;
        }
        .result .detail {
            font-size: 14px;
            color: #475569;
            text-align: center;
        }
        .note {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 8px;
            text-align: center;
        }
        hr {
            border: none;
            border-top: 1px solid #e5e7eb;
            margin: 20px 0;
        }
        .settings-section {
            display: none;
        }
        .range-preview {
            font-size: 14px;
            color: #1e40af;
            background: #e0e7ff;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>NDX Autopilot Calculator</h2>
        <div class="disclaimer">
            ⚠️ 免责声明：本工具仅供个人定投参考，不构成投资建议。投资有风险，决策需谨慎。
        </div>
        <div class="sub">五档PE + 年线偏离微调 · 支持自定义货币</div>

        <!-- 上方：市场数据 -->
        <label>
            PE 百分位 <span class="required">*</span>
            <a class="helper-link" href="https://danjuanfunds.com/dj-valuation-table-detail/NDX" target="_blank" rel="noopener">查看PE百分位</a>
        </label>
        <input type="number" id="peInput" placeholder="例如：45.5" min="0" max="100" step="any">

        <label>
            当前纳斯达克100价格 <span class="required">*</span>
            <a class="helper-link" href="https://finance.baidu.com/index/us-NDX" target="_blank" rel="noopener">查看价格</a>
        </label>
        <input type="number" id="priceInput" placeholder="例如：21000" step="any">

        <label>
            250日均线值 <span class="optional">（可选）</span>
            <a class="helper-link" href="https://www.tradinghero.com/chart?symbol=NAS100.INDEX" target="_blank" rel="noopener">查看均线</a>
        </label>
        <input type="number" id="ma250Input" placeholder="不填则跳过偏离微调" step="any">

        <!-- 折叠按钮 -->
        <button type="button" class="toggle-btn" id="toggleSettingsBtn" onclick="toggleSettings()">
            ⚙️ 展开自定义设置（可选）
        </button>

        <!-- 下方：自定义参数，默认折叠 -->
        <div class="settings-section" id="settingsSection">
            <hr>
            <label>货币符号（默认 ¥）</label>
            <input type="text" id="currencySymbol" value="¥" placeholder="¥">

            <label>定投中间值（正常档位金额）</label>
            <input type="number" id="midAmount" value="53" step="any" min="0" oninput="updateRangePreview()">
            <div class="range-preview" id="rangePreview"></div>

            <label>微调金额（年线偏离超过±20%时加减）</label>
            <input type="number" id="adjustAmount" value="5" step="any" min="0">
        </div>

        <button onclick="calc()">计算金额</button>

        <div class="result" id="result">
            <div class="row" id="peRow"></div>
            <div class="row" id="levelRow"></div>
            <div class="row" id="baseRow"></div>
            <div class="row" id="priceRow"></div>
            <div class="row" id="maRow"></div>
            <div class="row" id="devRow"></div>
            <div class="row" id="adjustRow"></div>
            <div class="detail">今日建议定投</div>
            <div class="amount" id="amount"></div>
            <div class="detail" id="note"></div>
        </div>
        <div class="note">* 必填项 | 默认人民币区间 24.6～82 元，可自行修改中间值</div>
    </div>

    <script>
        // 折叠面板切换
        function toggleSettings() {
            const section = document.getElementById('settingsSection');
            const btn = document.getElementById('toggleSettingsBtn');
            if (section.style.display === 'none' || section.style.display === '') {
                section.style.display = 'block';
                btn.textContent = '收起自定义设置';
            } else {
                section.style.display = 'none';
                btn.textContent = '⚙️ 展开自定义设置（可选）';
            }
        }

        // 根据中间值更新区间预览
        function updateRangePreview() {
            const mid = parseFloat(document.getElementById('midAmount').value);
            const currencySymbol = document.getElementById('currencySymbol').value || '¥';
            if (isNaN(mid) || mid <= 0) {
                document.getElementById('rangePreview').textContent = '请输入有效的中间值';
                return;
            }
            const minAmount = Math.round(mid * (24.6 / 53) * 10) / 10;
            const maxAmount = Math.round(mid * (82 / 53) * 10) / 10;
            document.getElementById('rangePreview').textContent = `自动生成区间：${currencySymbol}${minAmount} ~ ${currencySymbol}${maxAmount}`;
        }

        // 页面加载时初始化预览
        window.onload = function() {
            updateRangePreview();
        };

        // 五档对应的位置比例（0 ~ 1 之间）
        const levelRatios = [1, 0.756, 0.495, 0.251, 0];
        // 档位名称
        const levelNames = [
            '第1档：极度低估（PE < 20%）',
            '第2档：低估（20% ≤ PE < 50%）',
            '第3档：正常（50% ≤ PE < 80%）',
            '第4档：高估（80% ≤ PE < 95%）',
            '第5档：极度高估（PE ≥ 95%）'
        ];

        function calc() {
            // 读取自定义参数
            const currencySymbol = document.getElementById('currencySymbol').value || '¥';
            const midAmount = parseFloat(document.getElementById('midAmount').value);
            const adjustAmount = parseFloat(document.getElementById('adjustAmount').value);

            if (isNaN(midAmount) || midAmount <= 0) {
                alert('请输入有效的定投中间值');
                return;
            }
            if (isNaN(adjustAmount) || adjustAmount < 0) {
                alert('请输入有效的微调金额');
                return;
            }

            // 根据中间值自动生成最低和最高金额
            const minAmount = Math.round(midAmount * (24.6 / 53) * 10) / 10;
            const maxAmount = Math.round(midAmount * (82 / 53) * 10) / 10;

            // 读取市场数据
            const peInput = document.getElementById('peInput').value;
            const priceInput = document.getElementById('priceInput').value;
            const ma250Input = document.getElementById('ma250Input').value;

            const pe = parseFloat(peInput);
            if (isNaN(pe) || pe < 0 || pe > 100) {
                alert('请输入 0-100 之间的 PE 百分位数值');
                return;
            }
            const price = parseFloat(priceInput);
            if (isNaN(price) || price <= 0) {
                alert('请输入有效的纳斯达克100当前价格');
                return;
            }

            // 读取250日均线（可选）
            const ma250 = parseFloat(ma250Input);
            const hasMa250 = !isNaN(ma250) && ma250 > 0;

            // 根据最低最高生成五档基础金额
            const range = maxAmount - minAmount;
            const baseAmounts = levelRatios.map(ratio => minAmount + range * ratio);
            const roundedBase = baseAmounts.map(a => Math.round(a * 10) / 10);

            // 判断PE档位
            let levelIndex;
            if (pe < 20) levelIndex = 0;
            else if (pe < 50) levelIndex = 1;
            else if (pe < 80) levelIndex = 2;
            else if (pe < 95) levelIndex = 3;
            else levelIndex = 4;

            const baseAmount = roundedBase[levelIndex];
            const levelName = levelNames[levelIndex];

            // 计算年线偏离度（如果有均线值）
            let finalAmount = baseAmount;
            let adjustNote = '';
            let deviation = null;
            if (hasMa250) {
                deviation = (price - ma250) / ma250 * 100;
                if (deviation > 20) {
                    finalAmount = baseAmount - adjustAmount;
                    adjustNote = `年线偏离 +${deviation.toFixed(2)}% > 20%，基础金额减 ${adjustAmount}`;
                } else if (deviation < -20) {
                    finalAmount = baseAmount + adjustAmount;
                    adjustNote = `年线偏离 ${deviation.toFixed(2)}% < -20%，基础金额加 ${adjustAmount}`;
                } else {
                    adjustNote = `年线偏离 ${deviation.toFixed(2)}%，未超过±20%，不调整`;
                }
            } else {
                adjustNote = '未填写250日均线值，跳过年线偏离微调';
            }

            // 限制在自动生成的最低最高之间
            finalAmount = Math.max(minAmount, Math.min(maxAmount, finalAmount));
            finalAmount = Math.round(finalAmount * 10) / 10;

            // 显示结果
            document.getElementById('peRow').textContent = `PE 百分位：${pe.toFixed(2)}%`;
            document.getElementById('levelRow').textContent = `档位判断：${levelName}`;
            document.getElementById('baseRow').textContent = `基础金额：${currencySymbol}${baseAmount}`;
            document.getElementById('priceRow').textContent = `当前纳指价格：${price}`;
            document.getElementById('maRow').textContent = hasMa250 ? `250日均线：${ma250}` : '250日均线：未提供';
            document.getElementById('devRow').textContent = hasMa250 ? `年线偏离度：${deviation.toFixed(2)}%` : '年线偏离度：未计算';
            document.getElementById('adjustRow').textContent = `微调说明：${adjustNote}`;
            document.getElementById('amount').textContent = `${currencySymbol}${finalAmount}`;
            document.getElementById('note').textContent = `五档PE + 年线偏离自动微调 · 区间 ${currencySymbol}${minAmount} ~ ${currencySymbol}${maxAmount}`;

            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
